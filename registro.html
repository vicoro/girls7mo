<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
</head>
<body class="bg-light p-4">

  <div class="container my-4">
    <h2 class="fw-bold mb-4">Registra un nuevo producto</h2>

    
    <div class="card p-4 shadow-sm border-light-subtle rounded-3">
      <form>
       
        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="nombre" class="form-label text-secondary">Nombre del producto</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ej. Mouse">
          </div>
          <div class="col-md-6">
            <label for="precio" class="form-label text-secondary">Precio</label>
            <input type="number" class="form-control" id="precio" placeholder="0.00" step="0.01">
          </div>
        </div>

       
        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="categoria" class="form-label text-secondary">Categoría</label>
            <select class="form-select" id="categoria">
              <option selected>Seleccionar...</option>
              <option value="1">Tecnología</option>
              <option value="2">Accesorios</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="cantidad" class="form-label text-secondary">Cantidad</label>
            <input type="number" class="form-control" id="cantidad" placeholder="0">
          </div>
        </div>

        
        <div class="mb-4">
          <label for="descripcion" class="form-label text-secondary">Descripción</label>
          <textarea class="form-control" id="descripcion" rows="3" placeholder="Descripción del producto"></textarea>
        </div>

       
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4 fw-semibold">Guardar producto</button>
          <button type="reset" class="btn btn-secondary px-4 fw-semibold">Limpiar</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
